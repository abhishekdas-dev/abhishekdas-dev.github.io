name: Update Google Scholar citations

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Google Scholar stats
        env:
          SCHOLAR_ID: e3bDokMAAAAJ
        run: python .github/scripts/update_scholar.py

      - name: Commit updated stats
        run: |
          if [ -n "$(git status --porcelain scholar.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scholar.json
            git commit -m "chore: update Google Scholar citation stats"
            git push
          else
            echo "scholar.json unchanged; nothing to commit."
          fi
